name: AI16ROM AOSP Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout AI16ROM
        uses: actions/checkout@v4

      - name: AOSP source and build preflight
        shell: bash
        run: |
          set -e

          echo "===== RUNNER ====="
          uname -a
          uname -m
          nproc

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== STORAGE ====="
          df -h /

          echo
          echo "===== AI16ROM REPOSITORY ====="
          pwd
          du -sh .
          find device/infinix/X6711 -maxdepth 2 -type f | wc -l

          echo
          echo "===== AOSP SOURCE CHECK ====="
          for d in build frameworks system packages vendor device kernel; do
            if [ -d "$d" ]; then
              echo "PRESENT: $d"
            else
              echo "MISSING: $d"
            fi
          done

          echo
          echo "===== SOONG CHECK ====="
          if [ -f build/soong/soong_ui.bash ]; then
            echo "Soong source: PRESENT"
          else
            echo "Soong source: MISSING"
          fi

          echo
          echo "===== AOSP STATUS ====="
          if [ -d .repo ]; then
            echo ".repo: PRESENT"
          else
            echo ".repo: MISSING"
          fi

          echo
          echo "===== RESULT ====="
          echo "Runner is ready for the next AOSP provisioning stage."
