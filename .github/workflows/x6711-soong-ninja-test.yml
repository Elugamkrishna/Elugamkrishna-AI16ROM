      - name: Sync required build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          echo "===== SYNC SOONG ====="

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint

          echo "===== SYNC COMPLETE ====="

          test -d build/soong
          test -d build/make
          test -d build/blueprint

          echo "===== SIZES ====="
          du -sh build/soong
          du -sh build/make
          du -sh build/blueprint

          echo "===== FIND GO PROJECTS IN MANIFEST ====="
          grep -R "path=\".*go" .repo/manifests .repo/manifest.xml 2>/dev/null | head -50 || true

          echo "===== FIND GO TOOLCHAIN REFERENCES ====="
          grep -R "prebuilts/go" build/soong build/blueprint 2>/dev/null | head -50 || true
