name: AI16ROM X6711 Soong Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    name: X6711 ARM64 Soong Diagnostic
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout AI16ROM
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner Information
        run: |
          set -eux
          echo "===== RUNNER ====="
          uname -a
          uname -m
          nproc
          free -h
          df -h /
          echo
          echo "===== JAVA ====="
          java -version
          echo
          echo "===== CLANG ====="
          clang --version
          echo
          echo "===== NINJA ====="
          ninja --version

      - name: Install repo
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Initialize Android 16 AOSP
        run: |
          set -eux

          mkdir -p "$HOME/aosp"
          cd "$HOME/aosp"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android16-release \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-tags

          echo
          echo "===== MANIFEST ====="
          test -f .repo/manifest.xml
          grep -E 'revision=|android16-release' \
            .repo/manifests/default.xml | head -20 || true

      - name: Sync Soong Build Make Blueprint
        run: |
          set -eux

          cd "$HOME/aosp"

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint

          echo
          echo "===== SYNCED PROJECTS ====="
          repo list | grep -E 'build/(soong|make|blueprint)' || true

      - name: Prepare ARM64 Go
        run: |
          set -eux

          cd "$HOME/aosp"

          GO_BIN="$(command -v go)"
          GO_ROOT="$(go env GOROOT)"

          echo "===== SYSTEM GO ====="
          "$GO_BIN" version
          echo "GOROOT=$GO_ROOT"

          mkdir -p prebuilts/go

          if [ -e prebuilts/go/linux-arm64 ] && \
             [ ! -L prebuilts/go/linux-arm64 ]; then
            rm -rf prebuilts/go/linux-arm64
          fi

          if [ ! -e prebuilts/go/linux-arm64 ]; then
            ln -s "$GO_ROOT" prebuilts/go/linux-arm64
          fi

          export GOROOT="$GO_ROOT"
          export PATH="$GOROOT/bin:$PATH"

          echo
          echo "===== ARM64 GO READY ====="
          go version
          go env GOOS GOARCH GOROOT
          ls -ld prebuilts/go/linux-arm64

      - name: Copy X6711 Device Tree
        run: |
          set -eux

          cd "$HOME/aosp"

          mkdir -p device/infinix
          cp -a "$GITHUB_WORKSPACE/device/infinix/X6711" \
            device/infinix/

          echo
          echo "===== X6711 DEVICE TREE ====="
          test -f device/infinix/X6711/AndroidProducts.mk
          test -f device/infinix/X6711/BoardConfig.mk
          test -f device/infinix/X6711/device.mk

          find device/infinix/X6711 -maxdepth 2 -type f | \
            sort | head -100

      - name: Prepare Build Environment
        run: |
          set -eux

          cd "$HOME/aosp"

          export GOROOT="$(go env GOROOT)"
          export PATH="$GOROOT/bin:$PATH"

          source build/envsetup.sh

          lunch aosp_X6711-bp2a-userdebug

          echo
          echo "===== BUILD VARIABLES ====="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "OUT_DIR=$OUT_DIR"
          echo "TARGET_DEVICE=$TARGET_DEVICE"

      - name: Diagnose Blueprint Microfactory
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          export GOROOT="$(go env GOROOT)"
          export PATH="$GOROOT/bin:$PATH"

          mkdir -p "$OUT_DIR"

          echo "=============================================="
          echo " BLUEPRINT MICROFACTORY DIRECT DIAGNOSTIC"
          echo "=============================================="

          echo
          echo "===== GO ====="
          go version
          go env GOOS GOARCH GOROOT GOPATH GOFLAGS

          echo
          echo "===== BLUEPRINT ====="
          test -f build/blueprint/microfactory/microfactory.go
          sed -n '1,80p' build/blueprint/microfactory/microfactory.go

          echo
          echo "===== DIRECT GO BUILD ====="

          set +e

          go build \
            -x \
            -trimpath \
            -o "$OUT_DIR/microfactory-test" \
            ./build/blueprint/microfactory

          STATUS=$?

          set -e

          echo
          echo "=============================================="
          echo " MICROFACTORY EXIT STATUS: $STATUS"
          echo "=============================================="

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "===== GO ENVIRONMENT ====="
            go env
            echo
            echo "===== COMPILER ====="
            command -v go
            command -v compile || true
            go env GOROOT
            ls -l "$(go env GOROOT)/pkg/tool/linux_arm64/compile"
            exit "$STATUS"
          fi

          echo
          echo "===== MICROFACTORY BUILD SUCCESS ====="
          file "$OUT_DIR/microfactory-test"
          ls -lh "$OUT_DIR/microfactory-test"

      - name: Soong Bootstrap Diagnostic
        if: success()
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          export GOROOT="$(go env GOROOT)"
          export PATH="$GOROOT/bin:$PATH"

          echo "===== SOONG BOOTSTRAP ====="

          set +e

          build/soong/soong_ui.bash \
            --make-mode \
            nothing 2>&1 | tee "$GITHUB_WORKSPACE/soong-bootstrap.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "SOONG EXIT STATUS: $STATUS"

          if [ -f "$GITHUB_WORKSPACE/soong-bootstrap.log" ]; then
            echo
            echo "===== LAST 200 SOONG LINES ====="
            tail -200 "$GITHUB_WORKSPACE/soong-bootstrap.log"
          fi

          exit "$STATUS"

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6711-soong-diagnostic
          path: |
            /home/runner/aosp/soong-bootstrap.log
            /home/runner/aosp/out/**/*.log
          if-no-files-found: ignore

      - name: Final Status
        if: always()
        run: |
          echo "=============================================="
          echo " AI16ROM X6711 BUILD DIAGNOSTIC COMPLETE"
          echo "=============================================="
