name: AI16ROM X6711 Soong Ninja Test

on:
  workflow_dispatch:

jobs:
  soong-ninja:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout AI16ROM
        uses: actions/checkout@v4

      - name: Prepare runner
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            python3 \
            ninja-build \
            bc \
            bison \
            flex \
            build-essential

          echo "===== RUNNER ====="
          uname -m
          nproc
          free -h
          df -h /

      - name: Install repo
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod 0755 "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize Android 16
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/aosp"
          mkdir -p "$HOME/aosp"

          cd "$HOME/aosp"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android16-release \
            --depth=1 \
            --no-tags

          test -f .repo/manifest.xml

          echo "===== AOSP INIT OK ====="
          ls -lh .repo/manifest.xml

      - name: Sync required build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          echo "===== SYNC SOONG ====="

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint \
            prebuilts/go

          echo "===== SYNC COMPLETE ====="

          test -d build/soong
          test -d build/make
          test -d build/blueprint
          test -d prebuilts/go

          echo "===== SIZES ====="
          du -sh build/soong
          du -sh build/make
          du -sh build/blueprint
          du -sh prebuilts/go

      - name: Verify ARM64 Go
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          echo "===== GO DIRECTORY ====="

          find prebuilts/go -maxdepth 3 -type f \
            -name go \
            -print 2>/dev/null | head -20

          echo "===== EXPECTED GO ====="

          test -x prebuilts/go/linux-arm64/bin/go

          file prebuilts/go/linux-arm64/bin/go

          prebuilts/go/linux-arm64/bin/go version

      - name: Copy X6711 device tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          mkdir -p device/infinix

          cp -a \
            "$GITHUB_WORKSPACE/device/infinix/X6711" \
            device/infinix/X6711

          test -f device/infinix/X6711/BoardConfig.mk
          test -f device/infinix/X6711/AndroidProducts.mk

          echo "===== X6711 DEVICE TREE OK ====="

          ls -lh device/infinix/X6711/BoardConfig.mk
          ls -lh device/infinix/X6711/AndroidProducts.mk

      - name: Verify Ninja
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== NINJA ====="

          uname -m
          command -v ninja
          ninja --version
          file "$(command -v ninja)"

      - name: Verify Soong files
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          echo "===== SOONG ====="

          test -f build/soong/soong_ui.bash
          test -f build/soong/scripts/microfactory.bash
          test -f build/blueprint/microfactory/microfactory.bash

          ls -lh \
            build/soong/soong_ui.bash \
            build/soong/scripts/microfactory.bash \
            build/blueprint/microfactory/microfactory.bash

      - name: Soong diagnostic
        shell: bash
        run: |
          set +e

          cd "$HOME/aosp"

          export OUT_DIR="$HOME/aosp/out"

          echo "===== ENV ====="
          echo "OUT_DIR=$OUT_DIR"
          echo "PATH=$PATH"

          echo
          echo "===== GO ====="
          prebuilts/go/linux-arm64/bin/go version

          echo
          echo "===== ENVSETUP ====="
          source build/envsetup.sh

          echo
          echo "===== LUNCH ====="
          lunch aosp_X6711-bp2a-userdebug

          LUNCH_RC=$?

          echo
          echo "LUNCH EXIT CODE: $LUNCH_RC"

          if [ "$LUNCH_RC" -ne 0 ]; then
            exit "$LUNCH_RC"
          fi

          echo
          echo "===== SOONG UI ====="
          ls -lh build/soong/soong_ui.bash

          echo
          echo "===== SOONG START ====="

          build/soong/soong_ui.bash --make-mode nothing

          RC=$?

          echo
          echo "===== SOONG EXIT CODE ====="
          echo "$RC"

          echo
          echo "===== SOONG FILES ====="

          find "$OUT_DIR/soong" \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'soong.environment.*' \
              -o -name '*.ninja' \
              -o -name '*.log' \
            \) \
            -print 2>/dev/null | sort

          echo
          echo "===== STORAGE ====="
          df -h "$HOME"

          exit "$RC"
