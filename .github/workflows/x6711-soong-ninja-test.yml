      - name: Sync required Soong dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$HOME/aosp"

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint \
            prebuilts/go

          test -d build/soong
          test -d build/make
          test -d build/blueprint
          test -d prebuilts/go

          echo "===== REQUIRED BUILD TREES ====="
          du -sh build/soong
          du -sh build/make
          du -sh build/blueprint
          du -sh prebuilts/go
