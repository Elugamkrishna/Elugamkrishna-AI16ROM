name: AI16ROM X6711 Soong Bootstrap

on:
  workflow_dispatch:

jobs:
  soong-bootstrap:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout AI16ROM
        uses: actions/checkout@v4

      - name: Prepare runner
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            python3 \
            ninja-build \
            bc \
            bison \
            flex \
            build-essential

          echo "===== RUNNER ====="
          uname -m
          nproc
          free -h
          df -h /

      - name: Install repo
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize Android 16
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$HOME/aosp"
          mkdir -p "$HOME/aosp"

          cd "$HOME/aosp"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android16-release \
            --depth=1 \
            --no-tags

          test -f .repo/manifest.xml

          echo "===== AOSP INIT OK ====="

      - name: Sync required build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint

          test -d build/soong
          test -d build/make
          test -d build/blueprint

          echo "===== BUILD DEPENDENCIES READY ====="

      - name: Provide ARM64 Go path for Soong
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          GO_ROOT="$(go env GOROOT)"

          echo "System Go:"
          go version
          echo "GOROOT=$GO_ROOT"

          test -x "$GO_ROOT/bin/go"
          test -d "$GO_ROOT/src"

          mkdir -p "$HOME/aosp/prebuilts/go"

          rm -rf "$HOME/aosp/prebuilts/go/linux-arm64"

          ln -s \
            "$GO_ROOT" \
            "$HOME/aosp/prebuilts/go/linux-arm64"

          test -x \
            "$HOME/aosp/prebuilts/go/linux-arm64/bin/go"

          "$HOME/aosp/prebuilts/go/linux-arm64/bin/go" version

          echo "===== ARM64 GO READY ====="

      - name: Copy X6711 device tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          mkdir -p device/infinix

          cp -a \
            "$GITHUB_WORKSPACE/device/infinix/X6711" \
            device/infinix/X6711

          test -f device/infinix/X6711/AndroidProducts.mk
          test -f device/infinix/X6711/BoardConfig.mk
          test -f device/infinix/X6711/device.mk

          echo "===== X6711 DEVICE TREE READY ====="

      - name: AI16ROM X6711 - Soong Bootstrap
        shell: bash
        run: |
          set -eo pipefail

          cd "$HOME/aosp"

          export OUT_DIR="$HOME/aosp/out"

          source build/envsetup.sh

          lunch aosp_X6711-bp2a-userdebug

          echo "===== TARGET ====="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BOARD_PLATFORM=$TARGET_BOARD_PLATFORM"

          test "$TARGET_PRODUCT" = "aosp_X6711"
          test "$TARGET_BUILD_VARIANT" = "userdebug"

          echo "===== SOONG BOOTSTRAP ====="

          build/soong/soong_ui.bash --make-mode nothing

          echo "===== SOONG BOOTSTRAP PASS ====="

      - name: AI16ROM X6711 - Ninja Build
        shell: bash
        run: |
          set -eo pipefail

          cd "$HOME/aosp"

          export OUT_DIR="$HOME/aosp/out"

          source build/envsetup.sh

          lunch aosp_X6711-bp2a-userdebug

          echo "=================================================="
          echo " AI16ROM X6711 - DIRECT NINJA BUILD"
          echo "=================================================="

          echo
          echo "===== NINJA ====="
          command -v ninja
          ninja --version
          uname -m

          echo
          echo "===== BUILD TARGET ====="

          m \
            -j"$(nproc)" \
            systemimage \
            vendorimage \
            productimage \
            system_extimage \
            bootimage \
            vendorbootimage \
            dtboimage \
            vbmetaimage

          echo
          echo "=================================================="
          echo " AI16ROM X6711 - NINJA BUILD PASS"
          echo "=================================================="

      - name: Verify build outputs
        shell: bash
        run: |
          set -euxo pipefail

          cd "$HOME/aosp"

          echo "===== BUILD OUTPUTS ====="

          find "$OUT_DIR/target/product/X6711" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null | sort || true

          echo
          echo "===== OUTPUT SIZE ====="

          du -sh "$OUT_DIR/target/product/X6711" 2>/dev/null || true

          echo
          echo "===== STORAGE ====="

          df -h "$HOME"

      - name: Final status
        shell: bash
        run: |
          echo "=================================================="
          echo " AI16ROM X6711 BUILD FINISHED"
          echo "=================================================="
