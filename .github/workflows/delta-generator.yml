cd "$HOME/AI14ROM_GITHUB_LIGHT" || exit 1

mkdir -p .github/workflows

cat > .github/workflows/delta-generator.yml <<'YAML'
name: AI14ROM Delta Generator

on:
  workflow_dispatch:
  push:
    paths:
      - "ota_tool/**"
      - ".github/workflows/delta-generator.yml"

permissions:
  contents: read

jobs:
  build-delta-generator:
    name: Build delta_generator
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repository verification
        shell: bash
        run: |
          set -eux

          echo "=== REPOSITORY ==="
          pwd
          git rev-parse HEAD

          echo
          echo "=== OTA SOURCE ==="
          test -d ota_tool
          test -f ota_tool/full_build/CMakeLists.txt
          test -f ota_tool/update_engine/scripts/brillo_update_payload

          echo "ota_tool OK"

          echo
          echo "=== WORKFLOW COMMIT ==="
          git log -1 --oneline

      - name: Install Ubuntu build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            python3 \
            python3-pip \
            protobuf-compiler \
            libprotobuf-dev \
            libssl-dev \
            liblz4-dev \
            liblzma-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libbrotli-dev \
            libgflags-dev \
            libgtest-dev

      - name: Bootstrap OTA dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          echo "=== PREPARE OTA DEPENDENCIES ==="

          mkdir -p deps

          clone_or_update() {
            name="$1"
            url="$2"

            echo
            echo "=== DEPENDENCY: $name ==="
            echo "URL: $url"

            if [ -d "deps/$name" ] && \
               [ -n "$(find "deps/$name" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "Dependency already present: $name"
              return 0
            fi

            if [ -d "deps/$name/.git" ]; then
              echo "Existing git dependency: $name"
              git -C "deps/$name" fetch --depth=1 origin || true
            else
              echo "Cloning: $name"
              rm -rf "deps/$name"
              git clone --depth=1 "$url" "deps/$name"
            fi
          }

          clone_or_update libbase \
            https://android.googlesource.com/platform/system/libbase

          clone_or_update libchrome \
            https://android.googlesource.com/platform/external/libchrome

          clone_or_update libbrillo \
            https://android.googlesource.com/platform/external/libbrillo

          clone_or_update system_core \
            https://android.googlesource.com/platform/system/core

          clone_or_update system_extras \
            https://android.googlesource.com/platform/system/extras

          clone_or_update external_avb \
            https://android.googlesource.com/platform/external/avb

          clone_or_update gflags \
            https://android.googlesource.com/platform/external/gflags

          clone_or_update googletest \
            https://android.googlesource.com/platform/external/googletest

          clone_or_update puffin \
            https://android.googlesource.com/platform/external/puffin

          clone_or_update bsdiff \
            https://android.googlesource.com/platform/external/bsdiff

          clone_or_update zucchini \
            https://android.googlesource.com/platform/external/zucchini

          clone_or_update erofs-utils \
            https://android.googlesource.com/platform/external/erofs-utils

          clone_or_update lzma \
            https://android.googlesource.com/platform/external/lzma

          echo
          echo "=== FEC COMPATIBILITY PATH ==="

          if [ -d "deps/fec" ] && \
             [ -n "$(find deps/fec -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            echo "deps/fec already present"
          elif [ -d "deps/system_extras/libfec" ]; then
            ln -sfn system_extras/libfec deps/fec
            echo "Created deps/fec -> system_extras/libfec"
          else
            echo "WARNING: system_extras/libfec not present"
          fi

          echo
          echo "=== DEPENDENCY INVENTORY ==="

          for d in \
            libbase \
            libchrome \
            libbrillo \
            system_core \
            system_extras \
            external_avb \
            gflags \
            googletest \
            puffin \
            bsdiff \
            zucchini \
            erofs-utils \
            lzma
          do
            if [ -d "deps/$d" ]; then
              echo "OK   deps/$d"
            else
              echo "MISS deps/$d"
              exit 20
            fi
          done

          echo
          echo "=== CRITICAL SOURCES ==="

          test -d deps/external_avb/libavb
          test -d deps/puffin
          test -d deps/zucchini
          test -d deps/erofs-utils
          test -d deps/lzma

          echo "Critical dependencies OK"

          echo
          echo "=== DEPENDENCIES READY ==="
          find deps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Prepare EROFS host compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          echo "=== EROFS CONFIG ==="

          mkdir -p deps/erofs-utils/include

          if [ ! -f deps/erofs-utils/include/config.h ]; then
            cat > deps/erofs-utils/include/config.h <<'EOF'
#pragma once

#define PACKAGE_VERSION "1.8"
#define HAVE_MEMRCHR 1
#define HAVE_MKSTEMP 1
#define HAVE_FTRUNCATE 1
#define HAVE_PREAD 1
#define HAVE_PWRITE 1
#define HAVE_POSIX_FALLOCATE 1
EOF
          fi

          echo "ERofs host config ready"

          echo
          echo "=== EROFS NAMEI COMPATIBILITY ==="

          NAMEI="deps/erofs-utils/lib/namei.c"

          if [ -f "$NAMEI" ]; then
            if ! grep -q "AI14ROM_MAKEDEV_FALLBACK" "$NAMEI"; then
              sed -i '1i\
#ifndef AI14ROM_MAKEDEV_FALLBACK\
#define AI14ROM_MAKEDEV_FALLBACK\
#include <sys/sysmacros.h>\
#ifndef makedev\
#define makedev(major, minor) ((((unsigned long long)(major)) << 8) | ((unsigned long long)(minor) & 0xffULL))\
#endif\
#endif' "$NAMEI"
            fi
          fi

          echo "ERofs compatibility ready"

      - name: Prepare host source compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          echo "=== CHECK CMAKE ==="

          test -f CMakeLists.txt

          echo
          echo "=== REMOVE OLD TERMUX PATHS ==="

          sed -i \
            's#"/data/data/com.termux/files/home/AI14ROM_X6711/ota_tool/deps/external_avb/libavb/boringssl"#"${CMAKE_SOURCE_DIR}/../deps/external_avb/libavb/boringssl"#g' \
            CMakeLists.txt || true

          sed -i \
            's#include_directories("IR")##g' \
            CMakeLists.txt || true

          echo
          echo "=== CHECK BORINGSSL PATH ==="

          if grep -q '/data/data/com.termux' CMakeLists.txt; then
            echo "ERROR: Termux path still exists in CMakeLists.txt"
            exit 30
          fi

          echo "CMake portability check OK"

      - name: Configure delta_generator
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          rm -rf clean_build

          cmake \
            -S . \
            -B clean_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build delta_generator
        shell: bash
        run: |
          set -o pipefail

          cd ota_tool/full_build

          echo "=== BUILD delta_generator ==="

          cmake \
            --build clean_build \
            --target delta_generator \
            --parallel 2 \
            2>&1 | tee delta_generator_build.log

      - name: Verify delta_generator
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          BIN="ota_tool/full_build/clean_build/delta_generator"

          echo "=== FINAL VERIFICATION ==="

          test -x "$BIN"

          echo
          echo "SUCCESS"
          ls -lh "$BIN"

          echo
          echo "FILE"
          file "$BIN"

          echo
          echo "SHA256"
          sha256sum "$BIN"

          echo
          echo "HELP"
          "$BIN" --help || true

      - name: Upload delta_generator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator
          path: |
            ota_tool/full_build/clean_build/delta_generator
            ota_tool/full_build/delta_generator_build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator-build-log
          path: |
            ota_tool/full_build/delta_generator_build.log
            ota_tool/full_build/clean_build/CMakeCache.txt
            ota_tool/full_build/clean_build/CMakeFiles/
          if-no-files-found: ignore
          retention-days: 14
YAML

echo "=== YAML WRITTEN ==="
wc -l .github/workflows/delta-generator.yml

echo
echo "=== CRITICAL URLS ==="
grep -A1 'clone_or_update puffin' .github/workflows/delta-generator.yml
grep -A1 'clone_or_update zucchini' .github/workflows/delta-generator.yml
grep -A1 'clone_or_update lzma' .github/workflows/delta-generator.yml

echo
echo "=== GIT STATUS ==="
git status --short

echo
echo "=== COMMIT ==="
git add .github/workflows/delta-generator.yml
git commit -m "Fix complete AI14ROM delta generator workflow"

echo
echo "=== PUSH ==="
git push origin main

echo
echo "=== REMOTE COMMIT ==="
git ls-remote origin refs/heads/main
