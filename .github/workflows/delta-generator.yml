name: AI14ROM Delta Generator

on:
  workflow_dispatch:
  push:
    paths:
      - "ota_tool/**"
      - ".github/workflows/delta-generator.yml"

permissions:
  contents: read

jobs:
  build-delta-generator:
    name: Build delta_generator
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Check AI14ROM OTA source
        shell: bash
        run: |
          set -e

          echo "=== REPOSITORY ==="
          pwd
          ls -la

          echo
          echo "=== OTA TOOL ==="

          if [ ! -d "ota_tool" ]; then
            echo "ERROR: ota_tool/ is not present in this repository."
            echo "Upload ~/AI14ROM_X6711/ota_tool first."
            exit 10
          fi

          if [ ! -f "ota_tool/full_build/CMakeLists.txt" ]; then
            echo "ERROR: ota_tool/full_build/CMakeLists.txt missing."
            exit 11
          fi

          echo "ota_tool found."
          ls -lh ota_tool/full_build/CMakeLists.txt

      - name: Install Ubuntu build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            unzip \
            zip \
            protobuf-compiler \
            libprotobuf-dev \
            libssl-dev \
            liblz4-dev \
            liblzma-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libbrotli-dev \
            python3

      - name: Inspect OTA dependencies
        shell: bash
        run: |
          set -e

          cd ota_tool

          echo "=== DEPENDENCY DIRECTORIES ==="

          for d in \
            deps/libbase \
            deps/libchrome \
            deps/libbrillo \
            deps/external_avb \
            deps/gflags \
            deps/googletest \
            deps/puffin \
            deps/bsdiff \
            deps/zucchini \
            deps/erofs-utils \
            deps/lzma \
            deps/system_core \
            deps/system_extras
          do
            if [ -d "$d" ]; then
              echo "OK   $d"
            else
              echo "MISS $d"
            fi
          done

          echo
          echo "=== AVB CRYPTO HEADER ==="

          find deps/external_avb \
            -type f \
            \( -name "avb_crypto_ops_impl.h" \
               -o -name "is_boringssl.h" \) \
            -print || true

      - name: Prepare host compatibility fixes
        shell: bash
        run: |
          set -e

          cd ota_tool

          echo "=== EROFS HOST CONFIG ==="

          mkdir -p deps/erofs-utils/include

          if [ ! -f deps/erofs-utils/include/config.h ]; then
            cat > deps/erofs-utils/include/config.h <<'EOF'
          #pragma once

          #define PACKAGE_VERSION "1.8"
          #define HAVE_MEMRCHR 1
          #define HAVE_MKSTEMP 1
          #define HAVE_FTRUNCATE 1
          #define HAVE_PREAD 1
          #define HAVE_PWRITE 1
          #define HAVE_POSIX_FALLOCATE 1
          EOF
          fi

          echo
          echo "=== EROFS makedev COMPATIBILITY ==="

          NAMEI="deps/erofs-utils/lib/namei.c"

          if [ -f "$NAMEI" ]; then
            if ! grep -q "AI14ROM_MAKEDEV_FALLBACK" "$NAMEI"; then
              sed -i '1i\
          #ifndef AI14ROM_MAKEDEV_FALLBACK\
          #define AI14ROM_MAKEDEV_FALLBACK\
          #include <sys/sysmacros.h>\
          #ifndef makedev\
          #define makedev(major, minor) ((((unsigned long long)(major)) << 8) | ((unsigned long long)(minor) & 0xffULL))\
          #endif\
          #endif' "$NAMEI"
            fi
          fi

          echo
          echo "=== IT0A SHIM ==="

          mkdir -p shim

          cat > shim/itoa_fix.h <<'EOF'
          #pragma once

          #include <cstdint>
          #include <cstddef>

          namespace base {
          namespace debug {
          namespace internal {

          inline char* itoa_r(
              intptr_t value,
              char* buffer,
              size_t buffer_size,
              int radix,
              int padding) {

            if (!buffer || buffer_size == 0 ||
                radix < 2 || radix > 36) {
              return buffer;
            }

            char tmp[sizeof(intptr_t) * 8 + 3];
            size_t i = 0;

            bool negative = false;
            uintptr_t v;

            if (value < 0 && radix == 10) {
              negative = true;
              v = static_cast<uintptr_t>(-(value + 1));
              v += 1;
            } else {
              v = static_cast<uintptr_t>(value);
            }

            do {
              unsigned digit =
                  static_cast<unsigned>(v % static_cast<uintptr_t>(radix));

              tmp[i++] =
                  digit < 10
                      ? static_cast<char>('0' + digit)
                      : static_cast<char>('a' + digit - 10);

              v /= static_cast<uintptr_t>(radix);

            } while (v && i < sizeof(tmp) - 1);

            while (i < static_cast<size_t>(padding) &&
                   i < sizeof(tmp) - 1) {
              tmp[i++] = '0';
            }

            size_t out = 0;

            if (negative && out + 1 < buffer_size) {
              buffer[out++] = '-';
            }

            while (i && out + 1 < buffer_size) {
              buffer[out++] = tmp[--i];
            }

            buffer[out] = '\0';

            return buffer;
          }

          } // namespace internal
          } // namespace debug
          } // namespace base
          EOF

      - name: Bootstrap OTA dependencies
        shell: bash
        run: |
          set -eux
          cd ota_tool

          echo "=== PREPARE OTA DEPENDENCIES ==="

          mkdir -p deps

          clone_or_update() {
            name="$1"
            url="$2"

            if [ -d "deps/$name/.git" ]; then
              echo "Existing dependency: $name"
              git -C "deps/$name" fetch --depth=1 origin || true
            else
              echo "Cloning: $name"
              git clone --depth=1 "$url" "deps/$name"
            fi
          }

          clone_or_update libbase \
            https://android.googlesource.com/platform/system/libbase

          clone_or_update libchrome \
            https://android.googlesource.com/platform/external/libchrome

          clone_or_update libbrillo \
            https://android.googlesource.com/platform/external/libbrillo

          clone_or_update system_core \
            https://android.googlesource.com/platform/system/core

          clone_or_update system_extras \
            https://android.googlesource.com/platform/system/extras

          clone_or_update external_avb \
            https://android.googlesource.com/platform/external/avb

          clone_or_update gflags \
            https://android.googlesource.com/platform/external/gflags

          clone_or_update googletest \
            https://android.googlesource.com/platform/external/googletest

          clone_or_update puffin \
            https://android.googlesource.com/platform/external/puffin

          clone_or_update bsdiff \
            https://android.googlesource.com/platform/external/bsdiff

          clone_or_update zucchini \
            https://android.googlesource.com/platform/external/zucchini

          clone_or_update erofs-utils \
            https://android.googlesource.com/platform/external/erofs-utils

          clone_or_update lzma \
            https://android.googlesource.com/platform/external/lzma

          echo
          echo "=== DEPENDENCIES READY ==="
          find deps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort


      - name: Configure delta_generator
        shell: bash
        run: |
          set -e

          cd ota_tool/full_build

          rm -rf clean_build

          cmake \
            -S . \
            -B clean_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build delta_generator
        shell: bash
        run: |
          set -o pipefail

          cd ota_tool/full_build

          cmake \
            --build clean_build \
            --target delta_generator \
            --parallel 2 \
            2>&1 | tee delta_generator_build.log

      - name: Verify delta_generator
        shell: bash
        run: |
          set -e

          BIN="ota_tool/full_build/clean_build/delta_generator"

          echo "=== FINAL VERIFICATION ==="

          if [ ! -x "$BIN" ]; then
            echo "ERROR: delta_generator was not built."
            exit 20
          fi

          echo
          echo "SUCCESS"
          ls -lh "$BIN"
          file "$BIN"

          echo
          echo "SHA256"
          sha256sum "$BIN"

      - name: Upload delta_generator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator
          path: |
            ota_tool/full_build/clean_build/delta_generator
            ota_tool/full_build/delta_generator_build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator-build-log
          path: |
            ota_tool/full_build/delta_generator_build.log
            ota_tool/full_build/clean_build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 14
