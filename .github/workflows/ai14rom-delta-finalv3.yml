name: AI14ROM Delta Generator Final v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build delta_generator
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================

      - name: Checkout AI14ROM
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02 - VERIFY
      # ============================================================

      - name: Verify repository
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo " AI14ROM DELTA GENERATOR"
          echo " ANDROID 14 HOST BUILD"
          echo "========================================"

          git rev-parse HEAD
          git log -1 --oneline

          test -d ota_tool
          test -d ota_tool/full_build
          test -f ota_tool/full_build/CMakeLists.txt

          echo "REPOSITORY OK"

      # ============================================================
      # 03 - HOST DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            python3 \
            python3-pip \
            libssl-dev \
            libevent-dev \
            liblz4-dev \
            liblzma-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libbrotli-dev \
            libgflags-dev \
            libgtest-dev \
            libext2fs-dev

          echo
          clang --version | head -1
          cmake --version | head -1
          ninja --version

      # ============================================================
      # 04 - OTA DEPENDENCIES
      # ============================================================

      - name: Prepare OTA dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          mkdir -p deps

          clone_branch() {
            local name="$1"
            local branch="$2"
            local url="$3"

            rm -rf "deps/$name"

            git clone \
              --depth=1 \
              --branch "$branch" \
              "$url" \
              "deps/$name"
          }

          clone_main() {
            local name="$1"
            local url="$2"

            rm -rf "deps/$name"

            git clone \
              --depth=1 \
              "$url" \
              "deps/$name"
          }

          clone_branch libbase \
            android14-release \
            https://android.googlesource.com/platform/system/libbase

          clone_branch libchrome \
            android14-release \
            https://android.googlesource.com/platform/external/libchrome

          clone_branch libbrillo \
            android14-release \
            https://android.googlesource.com/platform/external/libbrillo

          clone_branch system_core \
            android14-release \
            https://android.googlesource.com/platform/system/core

          clone_branch system_logging \
            android14-d1-release \
            https://android.googlesource.com/platform/system/logging

          clone_branch system_extras \
            android14-release \
            https://android.googlesource.com/platform/system/extras

          clone_branch external_fec \
            android-platform-14.0.0_r31 \
            https://android.googlesource.com/platform/external/fec

          clone_branch external_avb \
            android14-release \
            https://android.googlesource.com/platform/external/avb

          clone_main gflags \
            https://android.googlesource.com/platform/external/gflags

          clone_main googletest \
            https://android.googlesource.com/platform/external/googletest

          clone_main puffin \
            https://android.googlesource.com/platform/external/puffin

          clone_main bsdiff \
            https://android.googlesource.com/platform/external/bsdiff

          echo "===== BSDIFF LAYOUT ====="
          find deps/bsdiff -maxdepth 5 -type f \
            \( -name 'diff_encoder.h' -o -name 'bsdiff.cc' \) -print

          echo "===== NORMALIZE BSDIFF HEADERS ====="
          mkdir -p deps/bsdiff/include/bsdiff

          find deps/bsdiff -maxdepth 1 -type f -name '*.h' -exec cp -f {} deps/bsdiff/include/bsdiff/ \;

          test -f deps/bsdiff/include/bsdiff/diff_encoder.h
          test -f deps/bsdiff/include/bsdiff/compressor_buffer.h
          test -f deps/bsdiff/include/bsdiff/compressor_interface.h

          echo "BSDIFF HEADERS:"
          find deps/bsdiff/include/bsdiff -maxdepth 1 -type f -name '*.h' -printf '%f\n' | sort


          test -f deps/bsdiff/include/bsdiff/diff_encoder.h
          echo "OK: deps/bsdiff/include/bsdiff/diff_encoder.h"

          clone_main zucchini \
            https://android.googlesource.com/platform/external/zucchini

          clone_branch erofs-utils \
            android-14.0.0_r61 \
            https://android.googlesource.com/platform/external/erofs-utils

          clone_main lzma \
            https://android.googlesource.com/platform/external/lzma

          echo
          echo "========================================"
          echo "LIBFEC SETUP"
          echo "========================================"

          test -f deps/external_fec/fec.h
          ln -sfn external_fec deps/fec
          test -f deps/fec/fec.h
          echo "OK: deps/fec/fec.h"

          test -f deps/system_logging/liblog/include/android/log.h
          echo "OK: deps/system_logging/liblog/include/android/log.h"

          echo
          echo "========================================"
          echo "DEPENDENCIES READY"
          echo "========================================"

          for d in \
            libbase \
            libchrome \
            libbrillo \
            system_core \
            system_logging \
            system_extras \
            external_fec \
            external_avb \
            gflags \
            googletest \
            puffin \
            bsdiff \
            zucchini \
            erofs-utils \
            lzma
          do
            test -d "deps/$d"
            echo "OK: deps/$d"
          done

      # ============================================================
      # 05 - GFLAGS
      # ============================================================

      - name: Build gflags
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          rm -rf gflags_build
          rm -rf deps/gflags_install

          cmake \
            -S deps/gflags \
            -B gflags_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGFLAGS_BUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/deps/gflags_install"

          cmake \
            --build gflags_build \
            --parallel 2

          cmake \
            --build gflags_build \
            --target install

          test -f deps/gflags_install/lib/libgflags.a

          echo "GFLAGS OK"

      # ============================================================
      # 06 - PROTOBUF
      # ============================================================

      - name: Build Protobuf 35.1
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          rm -rf deps/protobuf
          rm -rf protobuf_build
          rm -rf deps/protobuf_install

          git clone \
            --depth=1 \
            --branch v35.1 \
            https://github.com/protocolbuffers/protobuf.git \
            deps/protobuf

          cmake \
            -S deps/protobuf \
            -B protobuf_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -Dprotobuf_BUILD_LIBPROTOC=ON \
            -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/deps/protobuf_install"

          cmake \
            --build protobuf_build \
            --parallel 2

          cmake \
            --build protobuf_build \
            --target install

          test -x deps/protobuf_install/bin/protoc
          test -f deps/protobuf_install/lib/libprotobuf.a

          deps/protobuf_install/bin/protoc --version

      # ============================================================
      # 07 - EROFS
      # ============================================================

      - name: Prepare EROFS
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          mkdir -p deps/erofs-utils/include

          cat > deps/erofs-utils/include/config.h <<'EOF'
          #pragma once

          #define PACKAGE_VERSION "1.8"
          #define HAVE_MEMRCHR 1
          #define HAVE_MKSTEMP 1
          #define HAVE_FTRUNCATE 1
          #define HAVE_PREAD 1
          #define HAVE_PWRITE 1
          #define HAVE_POSIX_FALLOCATE 1
          EOF

          sed -i \
            -e '/^[[:space:]]*typedef u64[[:space:]]*__u64;$/d' \
            -e '/^[[:space:]]*typedef u64[[:space:]]*__le64;$/d' \
            -e '/^[[:space:]]*typedef u64[[:space:]]*__be64;$/d' \
            deps/erofs-utils/include/erofs/defs.h || true

          echo "EROFS READY"

      # ============================================================
      # 08 - LIBCHROME HOST COMPATIBILITY
      # ============================================================

      - name: Patch libchrome host compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          echo "========================================"
          echo "LIBCHROME HOST COMPATIBILITY"
          echo "========================================"

          # --------------------------------------------------------
          # FIX 1: TraceConfig declaration
          # --------------------------------------------------------

          HEADER="deps/libchrome/base/trace_event/memory_dump_manager.h"

          test -f "$HEADER"

          if ! grep -q 'base/trace_event/trace_config.h' "$HEADER"; then
            sed -i \
              '/#include "base\/trace_event\/trace_event.h"/a #include "base/trace_event/trace_config.h"' \
              "$HEADER"
          fi

          # --------------------------------------------------------
          # FIX 2: POSIX strerror_r on glibc host
          # --------------------------------------------------------

          STRERROR="deps/libbase/posix_strerror_r.cpp"
          test -f "$STRERROR"

          # Force the POSIX/XSI strerror_r declaration on the Ubuntu host.
          sed -i '/^#include <string.h>/i #undef _GNU_SOURCE' "$STRERROR"

          # Replace Android libbase's POSIX-return assumption with the GNU host variant.
          sed -i 's/return strerror_r(errnum, buf, buflen);/char* result = strerror_r(errnum, buf, buflen); if (result != buf) { strncpy(buf, result, buflen); if (buflen > 0) buf[buflen - 1] = 0; } return 0;/' "$STRERROR"

          echo "STRERROR_R PATCH:"
          grep -n -A5 -B3 'strerror_r(errnum' "$STRERROR"

          # --------------------------------------------------------
          # FIX 3: portable atomic fence
          # --------------------------------------------------------

          # --------------------------------------------------------
          # FIX 4: libbrillo S_BLKSIZE clashes with glibc sys/stat.h
          # --------------------------------------------------------
          FILE_UTILS="deps/libbrillo/brillo/file_utils.cc"
          test -f "$FILE_UTILS"
          sed -i 's/constexpr size_t S_BLKSIZE = 512;/constexpr size_t kBrilloSBlkSize = 512;/' "$FILE_UTILS"
          sed -i 's/\bS_BLKSIZE\b/kBrilloSBlkSize/g' "$FILE_UTILS"

          echo "FILE_UTILS S_BLKSIZE PATCH:"
          grep -n -A2 -B2 'kBrilloSBlkSize' "$FILE_UTILS"

          ATOMIC="deps/libchrome/base/atomicops_internals_portable.h"

          test -f "$ATOMIC"

          sed -i \
            's/__atomic_thread_fence(std::memory_order_seq_cst);/std::atomic_thread_fence(std::memory_order_seq_cst);/g' \
            "$ATOMIC"

          # --------------------------------------------------------
          # FIX 3: Android message pump is not required for host
          # --------------------------------------------------------

          echo "Checking Android message pump source"

          if grep -R -q "message_pump_android.cc" \
              deps/libchrome/base 2>/dev/null; then
            echo "Android message pump source exists; host CMake will exclude it"
          fi

          # --------------------------------------------------------
          # FIX 4: Android shared memory POSIX implementation
          # --------------------------------------------------------

          if grep -R -q "platform_shared_memory_region_posix.cc" \
              full_build/CMakeLists.txt 2>/dev/null; then
            sed -i \
              '/platform_shared_memory_region_posix\.cc/d' \
              full_build/CMakeLists.txt
          fi

          # --------------------------------------------------------
          # FIX 5: ChromeOS memory monitor
          # --------------------------------------------------------

          sed -i \
            '/memory_pressure_monitor_chromeos\.cc/d' \
            full_build/CMakeLists.txt || true

          # --------------------------------------------------------
          # FIX 6: Android message pump
          # --------------------------------------------------------

          sed -i \
            '/message_pump_android\.cc/d' \
            full_build/CMakeLists.txt || true

          # --------------------------------------------------------
          # FIX 7: test/performance sources
          # --------------------------------------------------------

          sed -i \
            '/json_perftest\.cc/d' \
            full_build/CMakeLists.txt || true

          sed -i \
            '/_perftest\.cc/d' \
            full_build/CMakeLists.txt || true

          # Remove ordinary unit-test source entries.
          sed -i \
            '/[A-Za-z0-9_\/-]\+_test\.cc/d' \
            full_build/CMakeLists.txt || true

          echo
          echo "TRACE CONFIG:"
          grep -n \
            'trace_config.h' \
            "$HEADER"

          echo
          echo "ATOMIC:"
          grep -n \
            'atomic_thread_fence' \
            "$ATOMIC"

          echo
          echo "LIBCHROME HOST PATCH COMPLETE"

      # ============================================================
      # 09 - ANDROID HOST CMAKE PATCH
      # ============================================================

      - name: Patch Android 14 host CMake
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          # Android host definition
          if "__ANDROID_HOST__" not in s:
              marker = "target_compile_definitions(delta_generator PRIVATE"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n  __ANDROID_HOST__",
                      1
                  )

          # Generated protobuf sources
          generated = [
              '  "${CMAKE_CURRENT_BINARY_DIR}/gen/update_engine/update_metadata.pb.cc"\n',
              '  "${CMAKE_CURRENT_BINARY_DIR}/gen/lz4diff/lz4diff.pb.cc"\n',
          ]

          if "update_metadata.pb.cc" not in s:
              marker = "set(GENERATED_PROTO"

              if marker in s:
                  pos = s.find(marker)
                  end = s.find(")", pos)

                  if end != -1:
                      s = (
                          s[:end]
                          + "\n"
                          + "".join(generated)
                          + s[end:]
                      )

          # Remove incompatible sources robustly.
          blocked = [
              "message_pump_android.cc",
              "message_pump_glib.cc",
              "message_pump_libevent.cc",
              "platform_shared_memory_region_posix.cc",
              "memory_pressure_monitor_chromeos.cc",
              "json_perftest.cc",
              "trace_event_filter_test_utils.cc",
          ]

          lines = []

          for line in s.splitlines(True):
              if any(x in line for x in blocked):
                  continue
              lines.append(line)

          s = "".join(lines)

          p.write_text(s)

          print("ANDROID HOST CMAKE PATCH COMPLETE")
          PY

          echo
          echo "========================================"
          echo "VERIFY CMAKE EXCLUSIONS"
          echo "========================================"

          if grep -n "message_pump_android.cc" CMakeLists.txt; then
            echo "ERROR: message_pump_android.cc remains"
            exit 1
          fi

          if grep -n "platform_shared_memory_region_posix.cc" CMakeLists.txt; then
            echo "ERROR: platform_shared_memory_region_posix.cc remains"
            exit 1
          fi

          if grep -n "memory_pressure_monitor_chromeos.cc" CMakeLists.txt; then
            echo "ERROR: ChromeOS source remains"
            exit 1
          fi

          echo "HOST SOURCE EXCLUSIONS OK"

      # ============================================================
      # 10 - LIBBRILLO HOST SOURCES
      # ============================================================

      - name: Complete libbrillo host sources
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          python3 <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          sources = [
              "brillo/backoff_entry.cc",
              "brillo/errors/error.cc",
              "brillo/errors/error_codes.cc",
              "brillo/flag_helper.cc",
              "brillo/message_loops/message_loop_utils.cc",
              "brillo/mime_utils.cc",
              "brillo/osrelease_reader.cc",
              "brillo/process_information.cc",
              "brillo/secure_blob.cc",
              "brillo/syslog_logging.cc",
              "brillo/type_name_undecorate.cc",
              "brillo/url_utils.cc",
              "brillo/userdb_utils.cc",
              "brillo/value_conversion.cc",
              "brillo/streams/input_stream_set.cc",
              "brillo/streams/memory_containers.cc",
              "brillo/streams/memory_stream.cc",
              "brillo/streams/stream_errors.cc",
              "brillo/streams/stream_utils.cc",
          ]

          for src in sources:
              full = Path("../deps/libbrillo") / src

              if not full.exists():
                  continue

              cmake_path = "${ROOT}/deps/libbrillo/" + src

              if cmake_path not in s:
                  anchor = (
                      '  "${ROOT}/deps/libbrillo/brillo/file_utils.cc"\n'
                  )

                  if anchor in s:
                      s = s.replace(
                          anchor,
                          anchor + f'  "{cmake_path}"\n',
                          1
                      )

          p.write_text(s)

          print("LIBBRILLO HOST SOURCES COMPLETE")
          PY

      # ============================================================
      # 11 - FINAL AUDIT
      # ============================================================

      - name: Final build configuration audit
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          echo "========================================"
          echo "FINAL CMAKE AUDIT"
          echo "========================================"

          grep -q "__ANDROID_HOST__" CMakeLists.txt

          if grep -n "message_pump_android.cc" CMakeLists.txt; then
            exit 1
          fi

          if grep -n "platform_shared_memory_region_posix.cc" CMakeLists.txt; then
            exit 1
          fi

          if grep -n "memory_pressure_monitor_chromeos.cc" CMakeLists.txt; then
            exit 1
          fi

          echo "FINAL AUDIT OK"

      # ============================================================
      # 12 - CONFIGURE
      # ============================================================

      - name: Prepare XZ compatibility headers
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          echo "========================================"
          echo " PREPARE XZ COMPATIBILITY HEADER"
          echo "========================================"

          test -f gen/xz_compat.h

          # Git cannot preserve the local Termux absolute symlink.
          # Create a real runner-local xz.h from the tracked compatibility header.
          rm -f gen/xz.h
          cp -f gen/xz_compat.h gen/xz.h

          test -f gen/xz.h
          test -f gen/xz_compat.h

          echo "===== XZ HEADER READY ====="
          ls -l gen/xz.h gen/xz_compat.h

          echo "===== XZ HEADER TYPE ====="
          file gen/xz.h

          echo "===== XZ HEADER CHECK ====="
          grep -q "#include <lzma.h>" gen/xz.h
          grep -q "xz_dec_init" gen/xz.h
          grep -q "xz_dec_run" gen/xz.h

          echo "XZ COMPATIBILITY HEADER READY"

      - name: Configure delta_generator
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          rm -rf clean_build

          PROTOBUF_ROOT="$PWD/../deps/protobuf_install"
          GFLAGS_ROOT="$PWD/../deps/gflags_install"

          test -x "$PROTOBUF_ROOT/bin/protoc"
          test -f "$PROTOBUF_ROOT/lib/libprotobuf.a"
          test -f "$GFLAGS_ROOT/lib/libgflags.a"

          export PATH="$PROTOBUF_ROOT/bin:$PATH"

          # Generate protobuf sources before CMake configure
          rm -rf clean_build
          mkdir -p clean_build/gen/update_engine clean_build/gen/lz4diff

          "$PROTOBUF_ROOT/bin/protoc" \
            --cpp_out="$PWD/clean_build/gen" \
            -I"$PWD/.." \
            "$PWD/../update_engine/update_metadata.proto"

          "$PROTOBUF_ROOT/bin/protoc" \
            --cpp_out="$PWD/clean_build/gen" \
            -I"$PWD/../update_engine" \
            "$PWD/../update_engine/lz4diff/lz4diff.proto"

          test -f clean_build/gen/update_engine/update_metadata.pb.cc
          test -f clean_build/gen/lz4diff/lz4diff.pb.cc

          echo "PROTOBUF SOURCES GENERATED"
          ls -lh clean_build/gen/update_engine/update_metadata.pb.cc
          ls -lh clean_build/gen/lz4diff/lz4diff.pb.cc

          cmake \
            -S . \
            -B clean_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-include cstdint -D__ANDROID_HOST__" \
            -DCMAKE_C_FLAGS="-D__ANDROID_HOST__" \
            -DCMAKE_PREFIX_PATH="$PROTOBUF_ROOT;$GFLAGS_ROOT" \
            -DProtobuf_ROOT="$PROTOBUF_ROOT" \
            -DProtobuf_DIR="$PROTOBUF_ROOT/lib/cmake/protobuf" \
            -DProtobuf_INCLUDE_DIR="$PROTOBUF_ROOT/include" \
            -DProtobuf_LIBRARY="$PROTOBUF_ROOT/lib/libprotobuf.a" \
            -DProtobuf_LITE_LIBRARY="$PROTOBUF_ROOT/lib/libprotobuf-lite.a" \
            -DProtobuf_PROTOC_EXECUTABLE="$PROTOBUF_ROOT/bin/protoc"

          echo
          echo "CMAKE CONFIGURE SUCCESS"

      # ============================================================
      # 13 - BUILD
      # ============================================================

      - name: Compile delta_generator
        shell: bash
        run: |
          set -o pipefail

          cd ota_tool/full_build

          echo
          echo "========================================"
          echo " COMPILING delta_generator "
          echo "========================================"

          cmake \
            --build clean_build \
            --target delta_generator \
            --parallel 2 \
            2>&1 | tee delta_generator_build.log

      # ============================================================
      # 14 - VERIFY
      # ============================================================

      - name: Verify delta_generator
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          BIN="ota_tool/full_build/clean_build/delta_generator"

          test -x "$BIN"

          echo
          echo "========================================"
          echo " DELTA GENERATOR COMPILE SUCCESS "
          echo "========================================"

          ls -lh "$BIN"

          echo
          echo "FILE:"
          file "$BIN"

          echo
          echo "SHA256:"
          sha256sum "$BIN"

          echo
          echo "HELP:"
          "$BIN" --help || true

      # ============================================================
      # 15 - SUCCESS ARTIFACT
      # ============================================================

      - name: Upload delta_generator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator-final
          path: |
            ota_tool/full_build/clean_build/delta_generator
            ota_tool/full_build/delta_generator_build.log
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16 - FAILURE LOG
      # ============================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator-failure-log
          path: |
            ota_tool/full_build/delta_generator_build.log
            ota_tool/full_build/clean_build/CMakeCache.txt
            ota_tool/full_build/clean_build/.ninja_log
          if-no-files-found: ignore
          retention-days: 14
