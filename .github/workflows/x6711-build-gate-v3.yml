name: AI16ROM X6711 Build Gate V3

'on':
  workflow_dispatch:

jobs:
  x6711-build-gate:
    name: X6711 ARM64 AOSP Bootstrap
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout AI16ROM
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Runner Validation
        run: |
          set -exo pipefail

          echo "===== ARM64 RUNNER ====="
          uname -a
          uname -m
          nproc
          free -h
          df -h /

          echo "===== JAVA ====="
          java -version

          echo "===== NINJA ====="
          ninja --version

          echo "===== RUNNER GO ====="
          go version

      - name: Install repo
        run: |
          set -exo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize Android 16
        run: |
          set -exo pipefail

          mkdir -p "$HOME/aosp"
          cd "$HOME/aosp"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android16-release \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-tags

          test -f .repo/manifest.xml

          echo "===== AOSP INIT PASS ====="

      - name: Sync Build Sources
        run: |
          set -exo pipefail

          cd "$HOME/aosp"

          repo sync \
            --current-branch \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            build/soong \
            build/make \
            build/blueprint

          echo "===== SOURCE CHECK ====="

          test -f build/soong/soong_ui.bash
          test -f build/make/core/main.mk
          test -f build/blueprint/microfactory/microfactory.bash
          test -f build/blueprint/microfactory/microfactory.go

          echo "build/soong     : PASS"
          echo "build/make      : PASS"
          echo "build/blueprint : PASS"

      - name: Install Complete ARM64 Go
        run: |
          set -exo pipefail

          cd "$HOME/aosp"

          GO_VERSION="1.24.13"
          GO_ARCHIVE="go${GO_VERSION}.linux-arm64.tar.gz"
          GO_URL="https://go.dev/dl/${GO_ARCHIVE}"
          GO_SHA256="74d97be1cc3a474129590c67ebf748a96e72d9f3a2b6fef3ed3275de591d49b3"

          echo "===== DOWNLOAD OFFICIAL GO ARM64 ====="

          curl -fL \
            "$GO_URL" \
            -o "$HOME/$GO_ARCHIVE"

          echo "${GO_SHA256}  $HOME/$GO_ARCHIVE" | sha256sum -c -

          echo "===== GO CHECKSUM PASS ====="

          rm -rf prebuilts/go/linux-arm64

          mkdir -p prebuilts/go/linux-arm64

          tar \
            -xzf "$HOME/$GO_ARCHIVE" \
            --strip-components=1 \
            -C prebuilts/go/linux-arm64

          test -x \
            prebuilts/go/linux-arm64/bin/go

          test -x \
            prebuilts/go/linux-arm64/pkg/tool/linux_arm64/compile

          echo "===== GO VERSION ====="

          prebuilts/go/linux-arm64/bin/go version

          echo "===== GO STANDARD LIBRARY ====="

          test -f \
            prebuilts/go/linux-arm64/pkg/linux_arm64/go/token.a

          test -f \
            prebuilts/go/linux-arm64/pkg/linux_arm64/io.a

          test -f \
            prebuilts/go/linux-arm64/pkg/linux_arm64/io/ioutil.a

          echo "go/token.a : PASS"
          echo "io.a       : PASS"
          echo "io/ioutil  : PASS"

          echo "===== COMPLETE ARM64 GO PASS ====="

      - name: Install X6711 Device Tree
        run: |
          set -exo pipefail

          cd "$HOME/aosp"

          mkdir -p device/infinix

          rm -rf device/infinix/X6711

          cp -a \
            "$GITHUB_WORKSPACE/device/infinix/X6711" \
            device/infinix/

          test -f device/infinix/X6711/AndroidProducts.mk
          test -f device/infinix/X6711/BoardConfig.mk
          test -f device/infinix/X6711/device.mk
          test -f device/infinix/X6711/aosp_X6711.mk

          echo "===== X6711 DEVICE TREE PASS ====="

      - name: Prepare Android Build Environment
        run: |
          set -exo pipefail

          cd "$HOME/aosp"

          export GOROOT="$HOME/aosp/prebuilts/go/linux-arm64"
          export PATH="$GOROOT/bin:$PATH"

          echo "===== AOSP GOROOT ====="
          echo "GOROOT=$GOROOT"

          "$GOROOT/bin/go" version

          "$GOROOT/bin/go" env GOOS GOARCH

          source build/envsetup.sh

          lunch aosp_X6711-bp2a-userdebug

          echo "===== LUNCH PASS ====="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "OUT_DIR=$OUT_DIR"

          test "$TARGET_PRODUCT" = "aosp_X6711"
          test "$TARGET_DEVICE" = "X6711"

      - name: Blueprint Microfactory
        run: |
          set -exo pipefail

          cd "$HOME/aosp"

          export GOROOT="$HOME/aosp/prebuilts/go/linux-arm64"
          export PATH="$GOROOT/bin:$PATH"

          source build/envsetup.sh

          lunch aosp_X6711-bp2a-userdebug

          echo "=============================================="
          echo " BLUEPRINT MICROFACTORY"
          echo "=============================================="

          BUILDDIR="$OUT_DIR" \
          SRCDIR="$TOP" \
          BLUEPRINTDIR="$TOP/build/blueprint" \
          bash -c '
            source "$BLUEPRINTDIR/microfactory/microfactory.bash"

            build_go microfactory \
              github.com/google/blueprint/microfactory/main
          '

          echo
          echo "===== MICROFACTORY RESULT ====="

          test -f "$OUT_DIR/microfactory"

          file "$OUT_DIR/microfactory"

          echo "===== MICROFACTORY PASS ====="

      - name: Final Pass
        if: success()
        run: |
          echo "=============================================="
          echo " AI16ROM X6711 V3 AOSP BOOTSTRAP: PASS"
          echo "=============================================="
