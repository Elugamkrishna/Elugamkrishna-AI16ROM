name: AI16ROM Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: System information
        run: |
          echo "=== CPU ==="
          nproc
          uname -m

          echo "=== MEMORY ==="
          free -h

          echo "=== STORAGE ==="
          df -h /

          echo "=== JAVA ==="
          java -version || true
