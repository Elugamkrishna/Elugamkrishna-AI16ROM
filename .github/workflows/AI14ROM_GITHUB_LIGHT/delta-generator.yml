name: AI14ROM Delta Generator

on:
  workflow_dispatch:
  push:
    paths:
      - "ota_tool/**"
      - ".github/workflows/delta-generator.yml"

permissions:
  contents: read

jobs:
  build-delta-generator:
    name: Build delta_generator
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository and workflow
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo " AI14ROM DELTA GENERATOR"
          echo "========================================"

          echo
          echo "=== COMMIT ==="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== OTA SOURCE ==="
          test -d ota_tool
          test -f ota_tool/full_build/CMakeLists.txt
          test -f ota_tool/update_engine/scripts/brillo_update_payload

          echo "OTA source: OK"

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            python3 \
            python3-pip \
            protobuf-compiler \
            libprotobuf-dev \
            libssl-dev \
            liblz4-dev \
            liblzma-dev \
            libzstd-dev \
            zlib1g-dev \
            libbz2-dev \
            libbrotli-dev \
            libgflags-dev \
            libgtest-dev

      - name: Bootstrap OTA dependencies
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          echo "========================================"
          echo " PREPARE OTA DEPENDENCIES"
          echo "========================================"

          mkdir -p deps

          clone_or_update() {
            name="$1"
            url="$2"

            echo
            echo "----------------------------------------"
            echo "DEPENDENCY: $name"
            echo "URL: $url"
            echo "----------------------------------------"

            if [ -d "deps/$name" ] && \
               [ -n "$(find "deps/$name" \
                 -mindepth 1 \
                 -maxdepth 1 \
                 -print \
                 -quit 2>/dev/null)" ]; then

              echo "Already present: $name"
              return 0
            fi

            if [ -d "deps/$name/.git" ]; then
              echo "Git dependency already exists: $name"
              git -C "deps/$name" fetch --depth=1 origin || true
            else
              echo "Cloning: $name"

              rm -rf "deps/$name"

              git clone \
                --depth=1 \
                "$url" \
                "deps/$name"
            fi
          }

          clone_or_update libbase \
            https://android.googlesource.com/platform/system/libbase

          clone_or_update libchrome \
            https://android.googlesource.com/platform/external/libchrome

          clone_or_update libbrillo \
            https://android.googlesource.com/platform/external/libbrillo

          clone_or_update system_core \
            https://android.googlesource.com/platform/system/core

          clone_or_update system_extras \
            https://android.googlesource.com/platform/system/extras

          clone_or_update external_avb \
            https://android.googlesource.com/platform/external/avb

          clone_or_update gflags \
            https://android.googlesource.com/platform/external/gflags

          clone_or_update googletest \
            https://android.googlesource.com/platform/external/googletest

          clone_or_update puffin \
            https://android.googlesource.com/platform/external/puffin

          clone_or_update bsdiff \
            https://android.googlesource.com/platform/external/bsdiff

          clone_or_update zucchini \
            https://android.googlesource.com/platform/external/zucchini

          clone_or_update erofs-utils \
            https://android.googlesource.com/platform/external/erofs-utils

          clone_or_update lzma \
            https://android.googlesource.com/platform/external/lzma

          echo
          echo "========================================"
          echo " FEC PATH"
          echo "========================================"

          if [ -d "deps/fec" ] && \
             [ -n "$(find deps/fec \
               -mindepth 1 \
               -maxdepth 1 \
               -print \
               -quit 2>/dev/null)" ]; then

            echo "deps/fec already exists"

          elif [ -d "deps/system_extras/libfec" ]; then

            ln -sfn system_extras/libfec deps/fec
            echo "Created deps/fec -> system_extras/libfec"

          else

            echo "WARNING: libfec not found"

          fi

          echo
          echo "========================================"
          echo " VERIFY DEPENDENCIES"
          echo "========================================"

          for d in \
            libbase \
            libchrome \
            libbrillo \
            system_core \
            system_extras \
            external_avb \
            gflags \
            googletest \
            puffin \
            bsdiff \
            zucchini \
            erofs-utils \
            lzma
          do
            if [ -d "deps/$d" ]; then
              echo "OK   deps/$d"
            else
              echo "FAIL deps/$d"
              exit 20
            fi
          done

          echo
          echo "=== CRITICAL DIRECTORIES ==="

          test -d deps/external_avb/libavb
          test -d deps/puffin
          test -d deps/zucchini
          test -d deps/erofs-utils
          test -d deps/lzma

          echo "Critical dependencies: OK"

          echo
          echo "=== DEPENDENCY LIST ==="

          find deps \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

      - name: Prepare EROFS compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          mkdir -p deps/erofs-utils/include

          if [ ! -f deps/erofs-utils/include/config.h ]; then

            cat > deps/erofs-utils/include/config.h <<'EOF'
#pragma once

#define PACKAGE_VERSION "1.8"
#define HAVE_MEMRCHR 1
#define HAVE_MKSTEMP 1
#define HAVE_FTRUNCATE 1
#define HAVE_PREAD 1
#define HAVE_PWRITE 1
#define HAVE_POSIX_FALLOCATE 1
EOF

          fi

          echo "EROFS config ready"

          NAMEI="deps/erofs-utils/lib/namei.c"

          if [ -f "$NAMEI" ]; then

            if ! grep -q "AI14ROM_MAKEDEV_FALLBACK" "$NAMEI"; then

              sed -i '1i\
#ifndef AI14ROM_MAKEDEV_FALLBACK\
#define AI14ROM_MAKEDEV_FALLBACK\
#include <sys/sysmacros.h>\
#ifndef makedev\
#define makedev(major, minor) ((((unsigned long long)(major)) << 8) | ((unsigned long long)(minor) & 0xffULL))\
#endif\
#endif' "$NAMEI"

            fi

          fi

          echo "EROFS compatibility ready"

      - name: Validate CMake portability
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          test -f CMakeLists.txt

          echo "=== CHECK OLD TERMUX PATHS ==="

          if grep -n \
            '/data/data/com.termux/files/home' \
            CMakeLists.txt; then

            echo "ERROR: Termux-specific path found"
            exit 30

          fi

          echo "CMake portability: OK"

          echo
          echo "=== PUFFIN URL CHECK ==="

          grep -n \
            'platform/external/puffin' \
            ../.github/workflows/delta-generator.yml

          echo
          echo "=== ZUCCHINI URL CHECK ==="

          grep -n \
            'platform/external/zucchini' \
            ../.github/workflows/delta-generator.yml

          echo
          echo "=== LZMA URL CHECK ==="

          grep -n \
            'platform/external/lzma' \
            ../.github/workflows/delta-generator.yml

      - name: Configure delta_generator
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          rm -rf clean_build

          cmake \
            -S . \
            -B clean_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build delta_generator
        shell: bash
        run: |
          set -o pipefail

          cd ota_tool/full_build

          echo "========================================"
          echo " BUILD delta_generator"
          echo "========================================"

          cmake \
            --build clean_build \
            --target delta_generator \
            --parallel 2 \
            2>&1 \
            | tee delta_generator_build.log

      - name: Verify delta_generator
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          BIN="ota_tool/full_build/clean_build/delta_generator"

          echo "========================================"
          echo " VERIFY delta_generator"
          echo "========================================"

          test -x "$BIN"

          echo
          echo "SUCCESS"

          ls -lh "$BIN"

          echo
          echo "FILE"

          file "$BIN"

          echo
          echo "SHA256"

          sha256sum "$BIN"

          echo
          echo "HELP"

          "$BIN" --help || true

      - name: Upload delta_generator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator
          path: |
            ota_tool/full_build/clean_build/delta_generator
            ota_tool/full_build/delta_generator_build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI14ROM-delta-generator-build-log
          path: |
            ota_tool/full_build/delta_generator_build.log
            ota_tool/full_build/clean_build/CMakeCache.txt
            ota_tool/full_build/clean_build/CMakeFiles/
          if-no-files-found: ignore
          retention-days: 14
YAML
