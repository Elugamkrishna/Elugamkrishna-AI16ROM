      - name: Apply host compatibility fixes
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool/full_build

          echo "========================================"
          echo "AI14ROM HOST COMPATIBILITY FIX"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          # Fix malformed include_directories nesting
          s = s.replace(
              '''include_directories(
          include_directories("../deps/fec")
          ''',
              '''include_directories(
            "../deps/fec"
          ''',
              1
          )

          # Host build must behave as Android-host, not ChromeOS.
          # libchrome otherwise enables USE_GLIB/USE_OZONE.
          marker = '''target_compile_definitions(delta_generator PRIVATE
          '''

          if marker in s:
              s = s.replace(
                  marker,
                  '''target_compile_definitions(delta_generator PRIVATE
            __ANDROID_HOST__
          ''',
                  1
              )
          else:
              raise SystemExit(
                  "ERROR: target_compile_definitions marker not found"
              )

          p.write_text(s)
          PY

          echo
          echo "========================================"
          echo "VERIFY CMAKE FIX"
          echo "========================================"

          grep -n -A10 \
            "target_compile_definitions(delta_generator PRIVATE" \
            CMakeLists.txt

          echo
          echo "========================================"
          echo "VERIFY INCLUDE BLOCK"
          echo "========================================"

          sed -n '1,35p' CMakeLists.txt

          echo
          echo "========================================"
          echo "HOST COMPATIBILITY FIX COMPLETE"
          echo "========================================"
