      - name: Build Protobuf
        shell: bash
        run: |
          set -euxo pipefail

          cd ota_tool

          rm -rf deps/protobuf
          rm -rf protobuf_build
          rm -rf deps/protobuf_install

          echo
          echo "========================================"
          echo "CLONE PROTOBUF v35.1"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch v35.1 \
            https://github.com/protocolbuffers/protobuf.git \
            deps/protobuf

          cd deps/protobuf

          echo
          echo "PROTOBUF COMMIT:"
          git rev-parse HEAD

          echo
          echo "PROTOBUF TAG:"
          git describe --tags --always

          cd ../..

          echo
          echo "========================================"
          echo "CONFIGURE PROTOBUF v35.1"
          echo "========================================"

          cmake \
            -S deps/protobuf \
            -B protobuf_build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -Dprotobuf_BUILD_LIBPROTOC=ON \
            -Dprotobuf_BUILD_PROTOC_BINARIES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/deps/protobuf_install"

          echo
          echo "========================================"
          echo "BUILD PROTOBUF v35.1"
          echo "========================================"

          cmake \
            --build protobuf_build \
            --parallel 2

          echo
          echo "========================================"
          echo "INSTALL PROTOBUF v35.1"
          echo "========================================"

          cmake \
            --build protobuf_build \
            --target install

          echo
          echo "========================================"
          echo "VERIFY PROTOBUF 7.35.1"
          echo "========================================"

          test -f \
            deps/protobuf_install/include/google/protobuf/runtime_version.h

          test -x \
            deps/protobuf_install/bin/protoc

          test -f \
            deps/protobuf_install/lib/libprotobuf.a

          echo
          echo "PROTOC:"

          deps/protobuf_install/bin/protoc --version

          deps/protobuf_install/bin/protoc --version | \
            grep -q "35.1"

          echo
          echo "RUNTIME VERSION:"

          grep -n \
            "PROTOBUF_VERSION" \
            deps/protobuf_install/include/google/protobuf/runtime_version.h \
            | head -10

          grep -q \
            "7035001" \
            deps/protobuf_install/include/google/protobuf/runtime_version.h

          echo
          echo "========================================"
          echo "PROTOBUF 7.35.1 MATCH: OK"
          echo "========================================"

          echo
          echo "LIBPROTOBUF:"

          ls -lh \
            deps/protobuf_install/lib/libprotobuf.a
