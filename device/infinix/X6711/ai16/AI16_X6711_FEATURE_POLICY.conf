# AI16ROM X6711 FEATURE POLICY

# Hardware-dependent features MUST be runtime detected.
CAMERA_RUNTIME_DETECTION=1
CALL_RECORDING_RUNTIME_DETECTION=1
VOICE_EFFECTS_RUNTIME_DETECTION=1
RAW_RUNTIME_DETECTION=1
OIS_RUNTIME_DETECTION=1
EIS_RUNTIME_DETECTION=1
HDR_RUNTIME_DETECTION=1

# Never claim unsupported camera modes.
FAKE_CAMERA_FEATURES=0

# AI architecture
ON_DEVICE_AI=1
CLOUD_AI_OPT_IN=1
AI_MEMORY_USER_CONTROLLED=1
AI_DESTRUCTIVE_ACTION_CONFIRMATION=1

# Security
ANDROID_SECURITY_BOUNDARY_AUTHORITATIVE=1
AI_SECURITY_IS_ADVISORY=1

# OTA
AB_OTA=1
AVB_REQUIRED=1
SLOT_HEALTH_CHECK=1
ROLLBACK_SUPPORT=1
